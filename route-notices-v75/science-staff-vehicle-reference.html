<main><h1>행정동 옆 차량 구역과 보도 비교</h1>
<p>아래는 <strong>2020년 11월 6일 촬영된 거리 사진</strong>이에요. 붉은 보도 남쪽의 차량 통로를 비교하는 자료이며, 버스 출발 05→06번·주차장 출발 03→04번 사이를 확인한 방문객 이동선 사진은 아니에요.</p>
<div class="grid">
<figure><h2>차단기 옆 출입 통제 표지</h2><a class="photo" href="../route-photos-v75/science-staff-gate-202011.png" target="_blank" rel="noreferrer" aria-label="출입 통제 표지 원본 사진 크게 보기"><img src="../route-photos-v75/science-staff-gate-202011.png" width="1024" height="1024" alt="은색 건물 옆 차량 차단기와 출입 통제 표지, 맞은편 붉은 포장 공간과 자전거 보관대"></a>
<figcaption><p><strong>차량 차단기와 출입 통제 표지</strong>를 찾아요. 표지는 직원 차량 출입에 관한 내용이며, 이 사진만으로 방문객이 통과할 수 있는 보행로를 정할 수는 없어요.</p><p class="meta">촬영 위치: 36.374739, 127.3754028 · 네이버 거리뷰</p></figcaption>

<figure><h2>기둥 옆에서 좁아지는 붉은 바닥</h2><a class="photo" href="../route-photos-v75/science-south-pillar-202011.png" target="_blank" rel="noreferrer" aria-label="기둥 옆 바닥 원본 사진 크게 보기"><img src="../route-photos-v75/science-south-pillar-202011.png" width="1024" height="1024" alt="은색 건물과 큰 둥근 기둥 아래 차량 통로, 왼쪽 붉은 바닥과 맞은편 자전거 보관대"></a>
<figcaption><p><strong>기둥·경계석·붉은 바닥</strong>을 비교해요. 기둥 아래의 검은 포장은 차량 통로이고, 붉은 바닥이 기둥 옆으로 어디까지 이어지는지는 사진에서 더 살펴봐야 해요.</p><p class="meta">촬영 위치: 36.3749795, 127.3752695 · 네이버 거리뷰</p></figcaption>
